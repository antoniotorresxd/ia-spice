<text x="40.0" y="50.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="start" letter-spacing="1.8">SISTEMA MULTIAGENTE PARA EL DISEÑO DE CIRCUITOS ANALÓGICOS</text>
<text x="38.0" y="98.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#0F172A" text-anchor="start">Diseño conceptual</text>
<line x1="40" y1="122" x2="1880" y2="122" stroke="#E2E8F0" stroke-width="2"/>
<text x="260.0" y="178.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FASE 1</text>
<text x="260.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" text-anchor="middle">DESCRIBIR</text>
<text x="260.0" y="772.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">El usuario pide su circuito</text>
<text x="260.0" y="803.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">con sus propias palabras</text>
<text x="260.0" y="850.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="middle">Interfaz web conversacional</text>
<text x="726.7" y="178.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FASE 2</text>
<text x="726.7" y="238.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" text-anchor="middle">DISEÑAR</text>
<text x="726.7" y="772.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">Agentes de IA interpretan el pedido</text>
<text x="726.7" y="803.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">y calculan los componentes</text>
<text x="726.7" y="850.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="middle">Sistema multiagente con modelos de lenguaje</text>
<text x="1193.3" y="178.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FASE 3</text>
<text x="1193.3" y="238.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" text-anchor="middle">VERIFICAR</text>
<text x="1193.3" y="772.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">Cada diseño se simula y se corrige</text>
<text x="1193.3" y="803.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">hasta cumplir la meta</text>
<text x="1193.3" y="850.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="middle">Simulación SPICE dentro del ciclo de diseño</text>
<text x="1660.0" y="178.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1.5">FASE 4</text>
<text x="1660.0" y="238.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" text-anchor="middle">ENTREGAR</text>
<text x="1660.0" y="772.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">Circuito listo: esquema, gráfica,</text>
<text x="1660.0" y="803.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">código y explicación</text>
<text x="1660.0" y="850.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="500" fill="#475569" text-anchor="middle">Diseño validado y documentado</text>
