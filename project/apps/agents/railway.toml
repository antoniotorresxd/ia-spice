# A diferencia de client/server, agents no comparte workspace con nadie:
# el Root Directory de este servicio en Railway debe ser `project/apps/agents`
# (el Dockerfile ya asume ese contexto). El Config File Path del servicio
# (Settings > Config as Code) debe apuntar a `apps/agents/railway.toml`.
#
# Este servicio no necesita dominio público: el server lo llama por red
# privada de Railway (AGENTS_BASE_URL = http://<servicio>.railway.internal:8000).

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
