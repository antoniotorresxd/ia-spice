# Banco de circuitos de prueba con solución de referencia.
#
# `referencia` es una LISTA de requisitos (Slice C): cada entrada trae
# `requisito` (el bloque/requisito al que corresponde), `metrica`, `objetivo`
# y `componentes` — la salida real de `calculo.catalog_solver.solve_catalog_circuit`
# para los mismos parámetros del caso, no una cuenta hecha a mano. No se usa
# para puntuar —eso se hace sobre la métrica que ngspice mide— sino para que
# el banco sea auditable: cualquiera puede recalcularla y comparar. Todos los
# casos de la primera tanda tienen un solo bloque con un solo requisito; el
# caso de composición al final tiene dos.
#
# `descripcion` es la entrada en lenguaje natural que consume la línea base
# best-of-N, para que compita sobre exactamente el mismo enunciado.
#
# NOTA (2026-09-27, Slice C): el banco original tenía 20 casos sobre cuatro
# `circuit_id` (`voltage_divider`, `rc_lowpass`, `led_resistor`,
# `noninverting_amp`) que ya no existen tal cual en
# `knowledge/circuit_client.py`/`calculo/catalog_solver.py` — el catálogo
# real de hoy usa `rc_lowpass_passive` y `opamp_noninverting_amp`, y
# `led_resistor` no tiene equivalente (no hay ningún `circuit_id` de
# LED+resistencia en el catálogo actual). Los cinco casos de LED se
# eliminaron en vez de forzarlos contra una topología que no es la misma; los
# de divisor y filtro se migraron al `circuit_id` real, con sus valores de
# referencia recalculados (el default de R1 del divisor cambió de 1 kΩ a
# 10 kΩ, y el filtro pasa de fijar R y resolver C a fijar C=10 nF y resolver
# R, así que los números viejos ya no aplicaban de todas formas).

casos:
  # --- Divisores de voltaje: R1 = 10 kΩ fijo, R2 = R1·v_out/(v_in − v_out) ---
  - id: divisor-12-5
    descripcion: "un divisor de voltaje que baje 12 V a 5 V"
    spec:
      blocks:
        - id: div1
          type: catalog
          params:
            circuit_id: voltage_divider
            params: {v_in: 12.0, v_out: 5.0}
            requirements: [{measure: v_out, value: 5.0}]
    referencia:
      - {requisito: div1, metrica: v_out, objetivo: 5.0, componentes: {r1: 10000.0, r2: 7142.86}}

  - id: divisor-5-3v3
    descripcion: "un divisor de voltaje de 5 V a 3.3 V"
