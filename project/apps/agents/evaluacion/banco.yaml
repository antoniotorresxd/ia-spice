          params:
            circuit_id: voltage_divider
            params: {v_in: 12.0, v_out: 5.0}
            requirements: [{measure: v_out, value: 5.0}]
    referencia:
      - {requisito: div1, metrica: v_out, objetivo: 5.0, componentes: {r1: 10000.0, r2: 7142.86}}

