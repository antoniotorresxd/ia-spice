  # --- Composición (Slice C) ---
  # Primer caso que ejercita lo que Slice B habilitó: un bloque cuya entrada
  # es la salida de otro, medido como un solo circuito compuesto. Reusa el
  # par opamp_highpass_active/opamp_noninverting_amp ya probado en
  # tests/test_composition.py — no es una ecuación de catálogo nueva.
  #
  # NOTA: un solo bloque con VARIOS requisitos (sin `connections`) todavía no
  # es medible — el camino no compuesto sigue produciendo una sola métrica
  # por plantilla (la que su propio `.control` calcula), y el vocabulario de
  # medidas de Slice B (`measurement_commands`) solo se invoca desde el
  # ensamblador de composición. Extenderlo a un bloque suelto es trabajo
  # futuro, no de este slice — ver la nota en el plan.
  - id: cascada-pasaaltas-ganancia-4
    descripcion: >-
      un circuito que reciba una señal senoidal de 1 V a 100 Hz, elimine
      componentes inferiores a 500 Hz mediante un filtro pasa-altas de primer
      orden y amplifique la señal resultante con una ganancia de 4 usando un
      amplificador no inversor
    spec:
      blocks:
        - id: hp
          type: catalog
          params:
            circuit_id: opamp_highpass_active
            params: {f_c: 500.0, gain: 1.0}
            requirements: [{measure: fc_-3db, value: 500.0}]
        - id: amp
          type: catalog
          params:
            circuit_id: opamp_noninverting_amp
            params: {v_in: 1.0, v_out: 4.0}
            requirements: [{measure: gain_at_freq, value: 4.0, frequency_hz: 5000}]
      connections: [["hp.vout", "amp.vin"]]
    referencia:
      - {requisito: hp, metrica: fc_-3db, objetivo: 500.0, componentes: {r: 31830.99, c: 1.0e-08, rg: 10000.0, rf: 10000.0}}
      - {requisito: amp, metrica: gain_at_freq, objetivo: 4.0, componentes: {rg: 1000.0, rf: 3000.0}}

  # --- Topologías agregadas con el paso a valores comerciales (2026-10) ---

