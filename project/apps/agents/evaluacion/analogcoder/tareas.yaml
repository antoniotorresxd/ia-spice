# Subconjunto del benchmark público de AnalogCoder (Lai et al., AAAI 2025),
# https://github.com/laiyao1/AnalogCoder, licencia MIT (ver LICENSE; commit en COMMIT).
# Se toman TODAS las tareas compatibles con el alcance a nivel tarjeta
# (op-amps y pasivos): 16-22 de 24. Las 1-15 son a nivel transistor (MOSFET)
# y 23-24 (VCO, PLL) quedan fuera del alcance declarado.
# `circuito`, `entrada_original` y `salida` se copian sin cambios de problem_set.tsv;
# `verificacion` y `referencia` son sus scripts originales, sin modificar.
tareas:
- id: analogcoder-16
  tarea_original: 16
  nivel_original: Hard
  tipo: Oscillator
  entradas: []
  salida: Vout
  verificacion: verificacion/Oscillator.py
  referencia: referencia/p16.py
  circuito: An RC phase-shift oscillator
  entrada_original: '-'
- id: analogcoder-17
  tarea_original: 17
  nivel_original: Hard
  tipo: Oscillator
  entradas: []
  salida: Vout
  verificacion: verificacion/Oscillator.py
  referencia: referencia/p17.py
  circuito: A Wien Bridge oscillator
  entrada_original: '-'
- id: analogcoder-18
  tarea_original: 18
  nivel_original: Hard
  tipo: Integrator
  entradas:
  - Vin
  salida: Vout
  verificacion: verificacion/Integrator.py
