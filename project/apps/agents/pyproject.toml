[project]
name = "agents"
version = "0.1.0"
description = "LangGraph-based agent pipeline for circuit netlist generation and ngspice simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.12",
    "langchain-anthropic>=1.4.8",
    "langchain-google-genai>=4.2.7",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.8",
    "pydantic>=2.13.4",
    "pyspice>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_llm: requiere SERVER_BASE_URL/AGENTS_SERVICE_TOKEN y un LLM activo real (se salta si no están configurados)",
]
