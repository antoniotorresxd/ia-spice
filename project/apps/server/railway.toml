# Root Directory de este servicio en Railway debe ser `project/` (la raíz del
# workspace de Bun), no `apps/server/`: el Dockerfile copia `package.json` y
# `bun.lock` desde ahí porque cliente y servidor comparten un único lock.
#
# El Config File Path del servicio en Railway (Settings > Config as Code) debe
# apuntar explícitamente a `apps/server/railway.toml`: Railway no sigue el
# Root Directory para localizar este archivo, hay que indicarlo a mano.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/server/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
