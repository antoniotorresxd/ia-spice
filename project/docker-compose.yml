# Despliegue reproducible del sistema (RIMP-10).
#
# Levanta agents + server (+ client, en dev) con un solo comando:
#
#     docker compose up --build
#
# El valor central de este archivo para la tesina no es la comodidad: es que
# la ejecución de los artefactos que produce el modelo —código PySpice y
# netlists que ngspice ejecuta— quede contenida dentro de un contenedor, que
# es el control de seguridad que el diseño reclama. Sin esto, esa afirmación
# no se sostiene.
#
# `client` es la excepción: va sin build propio (corre `vite dev` directo
# sobre bind mounts) porque en producción no se despliega por Docker sino por
# Railway (Railpack + bun run build:client/start:client, ver
# apps/client/railway.toml). Acá solo está para que `docker compose up`
# alcance para levantar todo en dev, hot reload incluido.

name: spice

services:
  agents:
    build:
      context: ./apps/agents
    environment:
      # Con el que la API llama a agents. Sin él, agents responde 503 a todo:
      # servir sin autenticar sería peor que no servir.
      AGENTS_API_TOKEN: ${AGENTS_API_TOKEN:?define AGENTS_API_TOKEN en .env}
      # Con el que agents consulta al servidor su configuración de LLM.
      # Dirección contraria, secreto distinto a propósito.
      AGENTS_SERVICE_TOKEN: ${AGENTS_SERVICE_TOKEN:?define AGENTS_SERVICE_TOKEN en .env}
      SERVER_BASE_URL: http://server:3001
      # El checkpointer guarda el estado en la misma Neon que usa el resto
      # del sistema —Neon habla los dos protocolos— pero en su propio esquema,
      # para que sus migraciones y las de Drizzle no se estorben. Ver
      # .env.example.
      CHECKPOINTER_URL: ${CHECKPOINTER_URL:?define CHECKPOINTER_URL en .env}
      # Los prompts de orquestador/documentador/curador viven solo en Langfuse
      # (no hay copia local de fallback), así que sin estas dos claves ningún
      # nodo con LLM tiene qué prompt usar y el pipeline entero queda inútil,
      # no solo el tracing.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?define LANGFUSE_PUBLIC_KEY en .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?define LANGFUSE_SECRET_KEY en .env}
      # Default a la región US: es donde vive el proyecto de Langfuse de este
      # repo (ver el host del MCP langfuse-spice). El SDK por defecto usa la
      # región EU (cloud.langfuse.com) si no se especifica, lo que produce un
      # 401 "invalid credentials" con keys válidas pero de otra región.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
    volumes:
      # Los pesos y umbrales del curador se montan, no se hornean: la tesina
      # exige poder ajustarlos durante la evaluación sin recompilar (RNF-04.2),
      # y reconstruir la imagen para mover una gamma sería justo lo contrario.
      - ./apps/agents/config:/app/config:ro
    ports:
      - "8000:8000"

  server:
    build:
      # El contexto es la raíz del workspace, no apps/server: cliente y
      # servidor comparten un solo bun.lock.
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3001
      DATA_BASE_URL: ${DATA_BASE_URL:?define DATA_BASE_URL en .env}
      DATA_BASE_URL_POOL: ${DATA_BASE_URL_POOL:?define DATA_BASE_URL_POOL en .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LLM_SECRETS_KEY: ${LLM_SECRETS_KEY:?define LLM_SECRETS_KEY en .env}
      AGENTS_SERVICE_TOKEN: ${AGENTS_SERVICE_TOKEN:?define AGENTS_SERVICE_TOKEN en .env}
      AGENTS_API_TOKEN: ${AGENTS_API_TOKEN:?define AGENTS_API_TOKEN en .env}
      AGENTS_BASE_URL: http://agents:8000
    ports:
      - "3001:3001"
    depends_on:
      agents:
        condition: service_healthy

  client:
    image: oven/bun:1
    working_dir: /app
    # Todo el workspace, no solo apps/client: bun resuelve el lock desde la
    # raíz. node_modules va en un volumen nombrado, no en el bind mount, para
    # no pisar el de tu host (binarios nativos como @tailwindcss/oxide se
    # resuelven por plataforma del contenedor, no la tuya).
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
    environment:
      # Dentro de la red del compose el server no es localhost, es el
      # hostname del servicio.
      VITE_API_PROXY_TARGET: http://server:3001
    command: sh -c "bun install --frozen-lockfile && bun run --cwd apps/client dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  client_node_modules:
